<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap & Snap 📷 Pro</title>
    
    <!-- Impor Font Futuristik dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Press+Start+2P&family=Space+Mono&display=swap" rel="stylesheet">
    
    <!-- Hubungkan ke file CSS utama -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <!-- 1. TAMPILAN AWAL -->
        <div id="start-screen">
            <h1>📷 Snap & Snap Pro</h1>
            <p class="description">Abadikan momen dengan gaya retro-futuristik!</p>
            <button id="start-btn" class="main-btn">
                Mulai Petualangan! <span class="spinner" style="display: none;"></span>
            </button>
            <p class="tip">Pastikan Anda mengizinkan akses kamera untuk memulai.</p>
        </div>

        <!-- 2. UI PHOTOBOX UTAMA (Awalnya tersembunyi) -->
        <div id="photobox-ui" style="display: none;">
            <div class="photobooth-area">
                <div class="photobooth">
                    <!-- Stream kamera akan ditampilkan di sini -->
                    <video id="video" autoplay playsinline muted></video>
                    <!-- Foto, template, dan efek digambar di sini -->
                    <canvas id="canvas"></canvas>
                    <!-- Overlay untuk efek dekorasi statis (jika diperlukan untuk efek CSS seperti glitch, tapi saat ini tidak) -->
                    <!-- <div id="effect-overlay" class="effect-overlay"></div> -->
                </div>
            </div>
            
            <div class="controls">
                
                <!-- Tombol Utama -->
                <button id="snap" class="main-btn snap-btn">AMBIL FOTO!</button>

                <!-- Pilihan Template/Frame -->
                <div class="options-group">
                    <h3>Pilih Template</h3>
                    <button class="template-btn active" data-template="none">None</button>
                    <button class="template-btn" data-template="assets/polaroid.png">Polaroid (Single)</button>
                    <button class="template-btn" data-template="assets/retro.png">Retro Film (Single)</button>
                    <button class="template-btn" data-template="multi-polaroid">Multi-Polaroid (4 Foto)</button>
                    <button class="template-btn" data-template="multi-retro">Multi-Retro (4 Foto)</button>
                </div>
                
                <!-- Pilihan Efek Statis (Filter JS) -->
                <div class="options-group">
                    <h3>Efek Statis</h3>
                    <button class="static-effect-btn active" data-effect="none">Normal</button>
                    <button class="static-effect-btn" data-effect="grayscale">B&W</button>
                    <button class="static-effect-btn" data-effect="sepia">Sepia</button>
                    <button class="static-effect-btn" data-effect="invert">Invert</button>
                </div>

                <!-- Kontrol Download & GIF -->
                <div class="options-group action-group">
                    <div class="gif-controls">
                        <button id="add-to-gif" class="action-btn" disabled>Tambah Frame GIF</button>
                        <span id="gif-status">0/4 Frame</span>
                        <button id="create-gif" class="action-btn" disabled>Buat & Simpan GIF!</button>
                        <!-- Status khusus untuk mode multi-frame -->
                        <span id="multi-frame-status" style="display:none;"></span>
                    </div>
                    
                    <div class="download-area">
                        <a id="download-link" class="download-btn" style="display: none;" download="snap-n-snap.png">Download Foto</a>
                        <button id="reset-btn" class="action-btn" style="display: none;">Mulai Ulang</button>
                    </div>
                </div>

                <!-- Tempat untuk menampilkan hasil GIF -->
                <img id="gif-result" src="" alt="Hasil GIF" style="display: none;">
            </div>
            
        </div>
    </div>
    
    <!-- Library untuk membuat GIF (offline, via CDN) -->
    <!-- Pastikan gif.js di-host di server yang sama atau izinkan CORS jika dari CDN.
         File gif.worker.js harus berada di 'js/' relatif terhadap index.html
         jika menggunakan workerScript: 'js/gif.worker.js'
    -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    
    <!-- Hubungkan ke file JavaScript utama -->
    <script type="module" src="js/app.js"></script>
</body>
</html>
