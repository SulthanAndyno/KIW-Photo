<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Snap & Snap — Pro</title>
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <div class="bg-aurora"></div>
  <div class="bg-grid"></div>
  <div class="scanlines"></div>

  <div class="container">
    <header class="brand">
      <div class="brand-left">
        <div class="dot" aria-hidden="true"></div>
        <h1>Snap &amp; Snap <span>Pro</span></h1>
      </div>
      <div class="brand-right eq" aria-hidden="true">
        <span></span><span></span><span></span><span></span>
      </div>
    </header>

    <main id="main">
      <section id="start-screen" class="panel">
        <h2>📷 Mulai Petualangan</h2>
        <p class="description">Abadikan momen dengan vibe retro-futuristik.</p>
        <button id="start-btn" class="main-btn">
          Nyalakan Kamera <span class="spinner" style="display:none"></span>
        </button>
        <p class="tip">Izinkan akses kamera di browser.</p>
      </section>

      <section id="photobox-ui" class="layout panel" style="display:none">
        <div class="photobooth-area">
          <div class="photobooth">
            <video id="video" autoplay playsinline muted></video>
            <canvas id="canvas"></canvas>
          </div>
        </div>

        <div class="controls">
          <button id="snap" class="main-btn">AMBIL FOTO!</button>

          <div class="options-group">
            <h3>Pilih Template</h3>
            <button class="template-btn active" data-template="none">1 FRAME</button>
            <button class="template-btn" data-template="multi-grid">4 FRAME</button>
            <!-- <button class="template-btn" data-template="multi-retro">RETRO (4 FOTO)</button> -->
          </div>

          <div class="options-group">
            <h3>Efek Statis</h3>
            <button class="static-effect-btn active" data-effect="none">Normal</button>
            <button class="static-effect-btn" data-effect="grayscale">B&amp;W</button>
            <button class="static-effect-btn" data-effect="invert">Invert</button>
            <button class="static-effect-btn" data-effect="thermal-neon">Thermal Neon</button>
          </div>

          <div class="options-group action-group">
            <span id="multi-frame-status" style="display:none"></span>
            <div class="download-area">
              <button id="download-link" class="download-btn" style="display:none">Download Foto</button>
              <button id="reset-btn" style="display:none">Mulai Ulang</button>
            </div>
          </div>
        </div>
      </section>
    </main>
  </div>

  <footer class="watermark">© 2025 — KUY FOTO</footer>

  <script type="module" src="js/app.js"></script>
</body>
</html>
