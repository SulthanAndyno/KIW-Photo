<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap & Snap 📷 Pro</title>
    
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <div id="start-screen">
            <h1>📷 Snap & Snap Pro</h1>
            <p class="description">Abadikan momen dengan gaya retro-futuristik!</p>
            <button id="start-btn" class="main-btn">
                Mulai Petualangan! <span class="spinner" style="display: none;"></span>
            </button>
            <p class="tip">Pastikan Anda mengizinkan akses kamera untuk memulai.</p>
        </div>

        <div id="photobox-ui" style="display: none;">
            <div class="photobooth-area">
                <div class="photobooth">
                    <video id="video" autoplay playsinline muted></video>
                    <canvas id="canvas"></canvas>
                </div>
            </div>
            
            <div class="controls">
                
                <button id="snap" class="main-btn snap-btn">AMBIL FOTO!</button>

                <div class="options-group">
                    <h3>Pilih Template</h3>
                    <button class="template-btn active" data-template="none">None</button>
                    <button class="template-btn" data-template="multi-polaroid">Polaroid (4 Foto)</button>
                    <button class="template-btn" data-template="multi-retro">Retro (4 Foto)</button>
                </div>
                
                <div class="options-group">
                    <h3>Efek Statis</h3>
                    <button class="static-effect-btn active" data-effect="none">Normal</button>
                    <button class="static-effect-btn" data-effect="grayscale">B&W</button>
                    <button class="static-effect-btn" data-effect="sepia">Sepia</button>
                    <button class="static-effect-btn" data-effect="invert">Invert</button>
                </div>

                <div class="options-group action-group">
                    <span id="multi-frame-status" style="display:none;"></span>
                    
                    <div class="download-area">
                        <a id="download-link" class="download-btn" style="display: none;" download="snap-n-snap.png">Download Foto</a>
                        <button id="reset-btn" class="action-btn" style="display: none;">Mulai Ulang</button>
                    </div>
                </div>
            </div>
            
        </div>
    </div>
    
    <script type="module" src="js/app.js"></script>
</body>
</html>
