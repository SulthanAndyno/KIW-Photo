<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snap & Snap 📷</title>
    
    <!-- 1. Impor Font Pixel dari Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
    
    <!-- 2. Hubungkan ke file CSS utama -->
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <div class="container">

        <!-- 1. TAMPILAN AWAL -->
        <div id="start-screen">
            <h1>📷 Snap & Snap</h1>
            <button id="start-btn">Mulai!</button>
        </div>

        <!-- 2. UI PHOTOBOX UTAMA (Awalnya tersembunyi) -->
        <div id="photobox-ui">
            <div class="photobooth">
                <!-- Stream kamera akan ditampilkan di sini -->
                <video id="video" autoplay playsinline></video>
                <!-- Foto, template, dan efek digambar di sini -->
                <canvas id="canvas"></canvas>
                <!-- Overlay untuk efek animasi CSS -->
                <div id="effect-overlay" class="effect-overlay"></div>
            </div>

            <div class="controls">
                <!-- Tombol utama untuk mengambil foto -->
                <button id="snap">Ambil Foto!</button>

                <!-- Pilihan Template/Frame -->
                <div class="options-group">
                    <h3>Pilih Template</h3>
                    <button class="template-btn active" data-template="none">Tanpa Frame</button>
                    <!-- Perhatikan path folder assets/ di sini -->
                    <button class="template-btn" data-template="assets/polaroid.png">Polaroid</button>
                    <button class="template-btn" data-template="assets/retro.png">Retro</button>
                </div>
                
                <!-- Pilihan Efek Statis (Filter CSS) -->
                <div class="options-group">
                    <h3>Efek Statis</h3>
                    <button class="static-effect-btn active" data-effect="none">Normal</button>
                    <button class="static-effect-btn" data-effect="grayscale(100%)">Grayscale</button>
                    <button class="static-effect-btn" data-effect="sepia(100%)">Sepia</button>
                    <button class="static-effect-btn" data-effect="invert(100%)">Invert</button>
                </div>

                <!-- Pilihan Efek Gerak (Animasi CSS & SVG) -->
                <div class="options-group">
                    <h3>Efek Gerak</h3>
                    <button class="motion-effect-btn active" data-effect="none">Tanpa Efek</button>
                    <button class="motion-effect-btn" data-effect="glow">Glow</button>
                    <button class="motion-effect-btn" data-effect="glitch">Glitch</button>
                    <button class="motion-effect-btn" data-effect="wave">Wave</button>
                </div>

                <!-- Kontrol untuk membuat GIF -->
                <div class="options-group">
                    <h3>Buat GIF Stop-Motion</h3>
                    <div class="gif-controls">
                        <button id="add-to-gif">Tambah Frame</button>
                        <span id="gif-status">0/4 Frame</span>
                        <button id="create-gif">Buat GIF!</button>
                    </div>
                </div>

                <!-- Tombol Download -->
                <a id="download-link" class="download-btn" style="display: none;" download="snap-n-snap.png">Download Foto</a>
            </div>
            
            <!-- Tempat untuk menampilkan hasil GIF -->
            <img id="gif-result" src="" alt="Hasil GIF" style="display: none;">
        </div>
    </div>
    
    <!-- Filter SVG untuk Efek Wave/Gelombang (Harus tetap di HTML) -->
    <svg class="hidden-svg">
        <filter id="wave-filter">
            <feTurbulence baseFrequency="0.02 0.05" numOctaves="3" result="turbulence" seed="2">
                <animate attributeName="baseFrequency" dur="10s" keyTimes="0;0.5;1" values="0.02 0.05;0.04 0.08;0.02 0.05" repeatCount="indefinite" />
            </feTurbulence>
            <feDisplacementMap in="SourceGraphic" in2="turbulence" scale="20" xChannelSelector="R" yChannelSelector="G" />
        </filter>
    </svg>

    <!-- 3. Library untuk membuat GIF (offline, via CDN) -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gif.js/0.2.0/gif.js"></script>
    
    <!-- 4. Hubungkan ke file JavaScript utama -->
    <script src="js/app.js"></script>
</body>
</html>
